name: Tests
description: |
  This workflow runs tests for devcontainer features and 
  creates a new release if changes are detected.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{fromJson(vars.FEATURES_JSON)}}
        base-image:
          - archlinux:latest
          - archlinux:base
          - archlinux:base-devel
          - archlinux:multilib-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup Node.js"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
      - name: "Install Dependencies"
        run: yarn install

      - name: "Generating tests for '${{ matrix.feature }}' against '${{ matrix.base-image }}'"
        run: make FEATURES=${{ matrix.feature }} BASE_IMAGE=${{ matrix.base-image }} test-autogenerated

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{fromJson(vars.FEATURES_JSON)}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup Node.js"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
      - name: "Install Dependencies"
        run: yarn install

      - name: "Generating tests for '${{ matrix.feature }}' scenarios"
        run: make FEATURES=${{ matrix.feature }} test-scenarios

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Setup Node.js"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
      - name: "Install Dependencies"
        run: yarn install

      - name: "Testing global scenarios"
        run: make test-global

  release:
    name: Release
    if: ${{github.event_name == 'push' }}
    needs: [test-autogenerated, test-scenarios, test-global]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - run: yarn install
      - name: Run semantic-release
        run: yarn run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
