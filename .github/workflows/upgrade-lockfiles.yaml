name: Upgrade Lockfiles
description: |
  This workflow automatically upgrades the devcontainer features lockfiles
  and creates a pull request if changes are detected.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Runs every Monday at midnight UTC

jobs:
  upgrade-devcontainer-features:
    runs-on: ubuntu-latest
    permissions: 
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Run upgrade script
        id: upgrade-script
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          make upgrade-lockfiles

          echo "Checking for changes..."
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected."
            echo "branch_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changes detected. Proceeding to push changes."
          branch_name="update-lockfiles"
          git config --global user.name "GitHub Action"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $branch_name
          git add .
          git commit -m "fix: Update devcontainer features"
          git push --force origin $branch_name
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: ${{ steps.upgrade-script.outputs.branch_name != '' }}
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Update devcontainer features"
          body: |
            This PR updates the devcontainer features to the latest versions
            detected by the 'scripts/feature_lock.sh' script.
            Please review the changes and merge if everything looks good.
            This PR was automatically generated by a GitHub Action.
          base: main
          branch: ${{ steps.upgrade-script.outputs.branch_name }}
          draft: false
          labels: "devcontainer"
          delete-branch: true