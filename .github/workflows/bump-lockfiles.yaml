name: Update Devcontainer Feature Lockfiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Runs every Monday at midnight UTC

jobs:
  update-devcontainer-features:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: update-lockfiles
    permissions: 
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run update script
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          chmod +x ./scripts/feature_lock.sh
          ./scripts/feature_lock.sh

          echo "Checking for changes..."
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected."
            exit 0
          fi

          echo "Changes detected. Proceeding to push changes."
          git config --global user.name "GitHub Action"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "fix: Update devcontainer features"
          git push --force origin $BRANCH_NAME

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Update devcontainer features"
          body: |
            This PR updates the devcontainer features to the latest versions
            detected by the 'scripts/feature_lock.sh' script.
            Please review the changes and merge if everything looks good.
            This PR was automatically generated by a GitHub Action.
          base: main
          branch: ${{ env.BRANCH_NAME }}
          draft: false
          labels: "devcontainer"
          delete-branch: true